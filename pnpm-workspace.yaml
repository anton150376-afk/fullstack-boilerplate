packages:
  - "apps/*"
  - "packages/*"

# catalogPrune: true стирает записи каталога, на которые не ссылается ни один
# package.json. Включён, потому что все записи сейчас используются (раньше,
# на пустом каркасе Фазы 1, он стёр react, zod, tanstack и orpc до того, как
# их подключили пакеты — B-261008-catalog-prune-too-early в docs/BACKLOG.md).
# Новая запись нужна только вместе с пакетом, который её использует: в режиме
# strict `pnpm add <пакет>` сам добавляет недостающую запись в каталог.
catalogMode: strict
catalogPrune: true
linkWorkspacePackages: false

catalog:
  # React
  react: 19.2.3
  react-dom: 19.2.3
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7
  "@types/node": 22.20.5

  # TypeScript — зафиксировано на 6.0.3 (D10, ADR-0001): typescript-eslint
  # не поддерживает TypeScript 7 (нет стабильного программного API до 7.1)
  typescript: 6.0.3
  tsx: 4.23.15

  # Zod — контракт и валидация
  zod: 4.6.5

  # Vitest
  vitest: 5.0.3
  "@vitest/coverage-v8": 5.0.3

  # Tailwind
  tailwindcss: 4.3.3

  # TanStack
  "@tanstack/react-query": 5.104.1
  "@tanstack/react-router": 1.170.41
  "@tanstack/react-start": 1.168.60
  "@tanstack/react-router-ssr-query": 1.167.3
  "@tanstack/react-table": 9.2.8
  # packages/admin-kit (Фаза 8) — @hookform/resolvers добавил поддержку
  # Zod 4 в резолверы сам автор Zod.
  react-hook-form: 7.89.0
  "@hookform/resolvers": 5.9.1
  "@tanstack/eslint-plugin-query": 5.104.1

  # oRPC — стабильная ветка v1 (D4, ADR-0001)
  "@orpc/client": 1.15.5
  "@orpc/contract": 1.15.5
  "@orpc/server": 1.15.5
  "@orpc/nest": 1.15.5
  "@orpc/openapi": 1.15.5
  "@orpc/tanstack-query": 1.15.5
  "@orpc/zod": 1.15.5

  # Локализация — общий пакет packages/i18n для веба, мобильного и сервера
  i18next: 26.4.2
  react-i18next: 17.0.16

  # Прочее, используемое несколькими пакетами
  culori: 4.0.2
  reflect-metadata: 0.2.2

  # Трассировка (apps/server, Фаза 4, пункт 9) — только стабильное ядро
  # 2.x (D12, ADR-0001); экспортёры и автоинструментации остаются 0.x и
  # сюда намеренно не добавлены.
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/sdk-trace-node": 2.12.0
  "@opentelemetry/resources": 2.12.0
  "@opentelemetry/context-async-hooks": 2.12.0
  "@orpc/openapi-client": 1.15.5
  "@tanstack/query-core": 5.104.1
  vite: 8.3.4
  "@vitejs/plugin-react": 6.1.2
  eslint: 10.12.0
  "@tailwindcss/vite": 4.3.3
  shadcn: 4.21.4
  prettier-plugin-tailwindcss: 0.8.1
  class-variance-authority: 0.7.1
  cn: 0.4.0
  tw-animate-css: 1.4.0
  "@base-ui/react": 1.9.0
  "@fontsource-variable/geist": 5.3.0
  "@testing-library/react": 16.3.3
  "@testing-library/jest-dom": 7.0.1
  jsdom: 30.1.2
  srvx: 0.11.22

  # apps/server, Фаза 4/5 (найдено гейтом test:coverage в Фазе 6, не по
  # памяти): esbuild — транспайлер Vitest по умолчанию — не эмитит
  # emitDecoratorMetadata (design:paramtypes), поэтому Nest DI в тестах
  # резолвит конструкторные параметры без явного @Inject() в undefined
  # вместо нужного провайдера. unplugin-swc — официально рекомендуемая
  # Nest заменой транспайлера для Jest/Vitest (см. docs/apps/server.md).
  "unplugin-swc": 2.0.0
  "@swc/core": 1.16.13
  # Запуск сервера в разработке и воркера: tsx (esbuild) не генерирует метаданные
  # декораторов, и внедрение зависимостей Nest ломается (undefined вместо
  # провайдера). @swc-node/register транспилирует через swc с метаданными.
  "@swc-node/register": 1.12.1

  # apps/mobile, packages/ui-native (Фаза 7) — Expo SDK 57
  expo: 57.0.27
  expo-router: 57.0.25
  expo-constants: 57.0.21
  expo-file-system: 57.0.7
  expo-linking: 57.0.12
  expo-localization: 57.0.2
  expo-network: 57.0.2
  expo-secure-store: 57.0.4
  expo-splash-screen: 57.0.9
  expo-status-bar: 57.0.1
  expo-system-ui: 57.0.4
  "react-native": 0.86.3
  "react-native-gesture-handler": 2.32.0
  "react-native-safe-area-context": 5.7.0
  "react-native-screens": 4.26.0
  # Версии, которых ждёт Expo SDK 57 (expo/bundledNativeModules.json, проверяет
  # `expo-doctor`): react и react-dom 19.2.3 (выше — другой рендерер, чем в
  # react-native 0.86), react-native-view-shot 5.1.0. Нативные пары
  # reanimated и worklets без явного объявления pnpm ставит свежими
  # (worklets 0.13 вместо 0.10.1) и их версии расходятся с нативным кодом
  # development build.
  "react-native-reanimated": 4.5.1
  "react-native-worklets": 0.10.1
  # Peer-зависимость @react-native/community-cli-plugin 0.86.3: без явной
  # версии pnpm берёт 0.87.
  "@react-native/metro-config": 0.86.3
  # metro.config.js подключает его напрямую; версия та же, что у Metro в Expo.
  metro-resolver: 0.84.5
  "react-native-view-shot": 5.1.0
  "react-native-web": 0.21.2
  "react-test-renderer": 19.2.3
  uniwind: 1.12.2
  # Hermes на этой версии не содержит Intl.PluralRules — без полифила
  # i18next молча разрешает только английские формы (раздел "Фаза 7"
  # задания, пункт 6). Импортируются из точек входа /polyfill-force.
  "@formatjs/intl-locale": 5.3.12
  "@formatjs/intl-pluralrules": 6.3.15
  "jest-expo": 57.0.5
  "@testing-library/react-native": 14.1.0
  # Peer-зависимость @testing-library/react-native 14: без явной версии pnpm
  # берёт 1.3.x с react-reconciler 0.34 (рендерер React 19.3). Под React 19.2.3,
  # которого ждёт Expo SDK 57, нужна 1.2.x (react-reconciler ~0.33).
  test-renderer: 1.2.0
  # jest-expo тянет jest@29.7.0 внутри себя — типы зафиксированы на той
  # же ветке 29.x, не последней 30.x, чтобы не расходиться с рантаймом.
  "@types/jest": 29.5.14

  # Сайт документации (раздел "Фаза 10" задания, пункт 10.3) — apps/docs.
  # vue — явная зависимость apps/docs, не только vitepress: srcDir
  # VitePress указывает на настоящий docs/ в корне репозитория
  # (содержимое не копируется), и Rollup при сборке резолвит
  # "vue/server-renderer" из markdown-файлов в docs/, а не из
  # node_modules vitepress — pnpm 11 (strict) не отдаёт транзитивную
  # зависимость vitepress в этом сценарии без явного объявления здесь
  # (найдено настоящей сборкой, не угадано).
  vitepress: 1.6.4
  vue: 3.5.43
  # apps/web/e2e: сквозные тесты в настоящем браузере (docs/apps/web.md).
  # Браузеры ставятся отдельно: npx playwright install chromium.
  "@playwright/test": 1.64.0

# Пакетам с postinstall-скриптами сборка разрешается явно по имени.
# esbuild — транзитивная зависимость vite/vitest; prisma/@prisma/engines —
# скачивают нативные движки запросов; msgpackr-extract — нативное ускорение
# сериализации у ioredis/bullmq. Без явного разрешения pnpm 11 их блокирует.
allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/engines": true
  msgpackr-extract: true
  "@swc/core": true

minimumReleaseAgeExclude:
  - "@orpc/client@1.15.5"
  - "@orpc/contract@1.15.5"
  - "@orpc/interop@1.15.5"
  - "@orpc/json-schema@1.15.5"
  - "@orpc/openapi-client@1.15.5"
  - "@orpc/openapi@1.15.5"
  - "@orpc/server@1.15.5"
  - "@orpc/shared@1.15.5"
  - "@orpc/standard-server-aws-lambda@1.15.5"
  - "@orpc/standard-server-fastify@1.15.5"
  - "@orpc/standard-server-fetch@1.15.5"
  - "@orpc/standard-server-node@1.15.5"
  - "@orpc/standard-server-peer@1.15.5"
  - "@orpc/standard-server@1.15.5"
  - "@orpc/zod@1.15.5"
  - "@orpc/nest@1.15.5"
  - "@orpc/tanstack-query@1.15.5"
  - "@shadcn/registry@0.1.3"
  - shadcn@4.21.4
  - "@testing-library/react-native@14.1.0"
